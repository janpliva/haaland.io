<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Proto">
<title>Joystick prototyp</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<!-- Prostřední pole nese hodinu (na čas) nebo cíl v gólech — nikdy nezůstane prázdné.
     Obsah plní showClock() v js/match.js. -->
<div id="hud">
  <div class="stat"><span class="k">Ty</span><span class="v" id="scB">0</span></div>
  <div class="stat mid"><span class="k" id="clockK">Do gólů</span><span class="v" id="clockV">5</span></div>
  <div class="stat right"><span class="k">Soupeř</span><span class="v" id="scR">0</span></div>
</div>

<!-- Svítí po celou dobu zlatého gólu, ne jen při přechodu. -->
<div id="golden" hidden>Zlatý gól</div>

<div id="gear">⚙</div>

<!-- řádky panelu se generují z TUNABLES v js/config.js -->
<div id="panel">
  <button id="reset">Reset pozic</button>
  <button id="defaults">Vrátit výchozí hodnoty</button>
</div>

<div id="flash">Ztráta míče</div>

<!-- Domovská obrazovka. Rozvržená jako hřiště: soupeř nahoře, ty dole, zápas mezi tím.
     Soupisky, list hráče i hromadná úprava se generují v js/menu.js. -->
<div id="menu" class="screen">
  <div class="home">
    <div id="lastResult" class="result" hidden></div>

    <button class="teamCard foe" id="cardR">
      <span class="tcTop"><span class="tcName">Protější tým</span><span class="tcDot"></span></span>
      <span class="tcSub" id="subR"></span>
      <span class="tcRoster" id="rosR"></span>
    </button>

    <!-- Volba režimu. Nabídka délek se generuje z MATCH_TIMES v js/config.js — kolik je
         v poli řádků, tolik je tlačítek. -->
    <div class="modeBox">
      <div class="segLab">Režim zápasu</div>
      <div class="segs" id="modeSegs">
        <button class="seg" data-mode="goals">Na góly</button>
        <button class="seg" data-mode="timed">Na čas</button>
      </div>
      <div id="timeWrap" hidden>
        <div class="segLab">Délka zápasu</div>
        <div class="segs" id="timeSegs"></div>
      </div>
    </div>

    <button class="play" id="playBtn">Hrát zápas</button>

    <button class="teamCard own" id="cardB">
      <span class="tcTop"><span class="tcName">Můj tým</span><span class="tcDot"></span></span>
      <span class="tcSub" id="subB"></span>
      <span class="tcRoster" id="rosB"></span>
    </button>
  </div>
</div>

<!-- Soupiska jednoho týmu -->
<div id="squad" class="screen" hidden>
  <header class="bar">
    <button class="back" id="squadBack">Zpět</button>
    <h2 id="squadTitle"></h2>
  </header>
  <div class="scroll" id="squadBody"></div>
  <div class="barBottom">
    <button class="ghost" id="randBtn">Náhodně</button>
    <button class="ghost" id="fiftyBtn">Výchozí</button>
  </div>
</div>

<!-- List jednoho hráče -->
<div id="sheet" class="screen" hidden>
  <header class="bar">
    <button class="back" id="sheetBack">Zpět</button>
    <h2 id="sheetTitle"></h2>
  </header>
  <div class="scroll" id="sheetBody"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
